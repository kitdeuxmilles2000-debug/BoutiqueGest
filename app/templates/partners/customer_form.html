{% extends "base.html" %}
{% block title %}Modifier client{% endblock %}
{% block heading %}Modifier · {{ customer.name }}{% endblock %}

{% block content %}
<div class="card form-narrow">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="name">Nom</label><input type="text" id="name" name="name" value="{{ customer.name }}" required></div>
    <div class="field"><label for="contact">Contact</label><input type="text" id="contact" name="contact" value="{{ customer.contact or '' }}"></div>
    <div class="field"><label for="credit_limit">Plafond de credit</label><input type="text" id="credit_limit" name="credit_limit" value="{{ customer.credit_limit | num }}"></div>
    <div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="2">{{ customer.notes or '' }}</textarea></div>
    <label class="row" style="gap:6px;margin-bottom:14px"><input type="checkbox" name="active" {{ 'checked' if customer.active }}> Actif</label>
    <div class="row"><button class="btn" type="submit">Enregistrer</button><a href="{{ url_for('partners.customers') }}" class="btn ghost">Annuler</a></div>
  </form>
</div>
{% endblock %}
