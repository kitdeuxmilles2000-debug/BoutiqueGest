{% extends "base.html" %}
{% block title %}Changer le mot de passe{% endblock %}
{% block heading %}Changer le mot de passe{% endblock %}

{% block content %}
<div class="card">
  <h2>Sécurité du compte</h2>
  <p class="sub">Choisissez un mot de passe d'au moins 8 caractères.</p>

  <form method="post" action="{{ url_for('auth.change_password') }}" class="form-narrow">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current_password">Mot de passe actuel</label>
      <input type="password" id="current_password" name="current_password" required>
    </div>
    <div class="field">
      <label for="new_password">Nouveau mot de passe</label>
      <input type="password" id="new_password" name="new_password" required>
      <p class="hint">8 caractères minimum.</p>
    </div>
    <div class="field">
      <label for="confirm_password">Confirmer le nouveau mot de passe</label>
      <input type="password" id="confirm_password" name="confirm_password" required>
    </div>
    <button type="submit" class="btn">Enregistrer</button>
  </form>
</div>
{% endblock %}
