services:
  - type: web
    name: boutiquegest
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask --app run db upgrade && flask --app run seed
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SYNC_API_TOKEN
        generateValue: true
      - key: CLOUD_READ_ONLY
        value: "1"
      - key: GITHUB_SYNC_ENABLED
        value: "1"
      - key: GITHUB_SYNC_REPOSITORY
        value: kitdeuxmilles2000-debug/BoutiqueGest
      - key: GITHUB_SYNC_TOKEN
        sync: false
      - key: GITHUB_SYNC_BRANCH
        value: boutiquegest-data
      - key: GITHUB_SYNC_PATH
        value: sync/boutiquegest-snapshot.json.gz
      - key: GITHUB_SYNC_POLL_SECONDS
        value: "30"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/instance/boutiquegest.db
      - key: TZ
        value: Africa/Kinshasa
      - key: PYTHONUNBUFFERED
        value: "1"
